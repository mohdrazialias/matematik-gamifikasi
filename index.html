<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Profil & Skor Terintegrasi</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .dashboard {
            display: flex;
            gap: 20px;
            max-width: 900px;
            width: 100%;
            flex-wrap: wrap;
            justify-content: center;
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            flex: 1;
            min-width: 320px;
            max-width: 400px;
            box-sizing: border-box;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-top: 0;
            margin-bottom: 20px;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-weight: bold;
        }
        input[type="text"], textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        textarea { resize: none; height: 70px; }
        button {
            width: 100%;
            padding: 12px;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 15px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        .btn-green { background-color: #28a745; }
        .btn-blue { background-color: #007bff; }
        .btn-red { background-color: #dc3545; }
        
        /* Gaya Paparan Profil & Skor */
        .display-data p {
            font-size: 16px;
            background: #f9f9f9;
            padding: 10px;
            border-radius: 5px;
            border-left: 5px solid #007bff;
            margin: 10px 0;
        }
        .score-box {
            text-align: center;
            font-size: 48px;
            font-weight: bold;
            color: #28a745;
            margin: 20px 0;
            background: #e8f5e9;
            padding: 15px;
            border-radius: 8px;
        }
        .score-controls {
            display: flex;
            gap: 10px;
        }
        .score-controls button { flex: 1; }
    </style>
</head>
<body>

<div class="dashboard">
    
    <!-- BAHAGIAN 1: KAD PROFIL -->
    <div class="card">
        <!-- Borang Input Profil -->
        <div id="formSection">
            <h2>Cipta Profil</h2>
            <div class="form-group">
                <label for="nameInput">Nama Penuh:</label>
                <input type="text" id="nameInput" placeholder="Masukkan nama anda">
            </div>
            <div class="form-group">
                <label for="bioInput">Bio Diri:</label>
                <textarea id="bioInput" placeholder="Ceritakan sedikit tentang diri anda"></textarea>
            </div>
            <button class="btn-green" onclick="saveProfile()">Simpan Profil</button>
        </div>

        <!-- Paparan Profil Terjaga -->
        <div id="displaySection" class="display-data" style="display: none;">
            <h2>Profil Pengguna</h2>
            <p><strong>Nama:</strong> <span id="displayName"></span></p>
            <p><strong>Bio:</strong> <span id="displayBio"></span></p>
            <button class="btn-blue" onclick="editProfile()">Edit Profil</button>
            <button class="btn-red" onclick="deleteProfile()">Padam Profil</button>
        </div>
    </div>

    <!-- BAHAGIAN 2: KAD SISTEM SKOR -->
    <div class="card">
        <h2>Skor Semasa</h2>
        <div class="score-box" id="scoreDisplay">0</div>
        
        <div class="score-controls">
            <button class="btn-green" onclick="changeScore(1)">+1 Mata</button>
            <button class="btn-red" onclick="changeScore(-1)">-1 Mata</button>
        </div>
        <button class="btn-blue" style="background-color: #6c757d;" onclick="resetScore()">Reset Skor</button>
    </div>

</div>

<script>
    // ==========================================
    // LOGIK JAVASCRIPT UNTUK SISTEM PROFIL
    // ==========================================
    function saveProfile() {
        const name = document.getElementById('nameInput').value.trim();
        const bio = document.getElementById('bioInput').value.trim();

        if (name === "" || bio === "") {
            alert("Sila isi semua ruangan profil!");
            return;
        }

        const userProfile = { name: name, bio: bio };
        localStorage.setItem('savedProfile', JSON.stringify(userProfile));
        checkProfile();
    }

    function checkProfile() {
        const data = localStorage.getItem('savedProfile');
        if (data) {
            const profile = JSON.parse(data);
            document.getElementById('displayName').innerText = profile.name;
            document.getElementById('displayBio').innerText = profile.bio;
            document.getElementById('formSection').style.display = 'none';
            document.getElementById('displaySection').style.display = 'block';
        } else {
            document.getElementById('formSection').style.display = 'block';
            document.getElementById('displaySection').style.display = 'none';
        }
    }

    function editProfile() {
        const data = localStorage.getItem('savedProfile');
        if (data) {
            const profile = JSON.parse(data);
            document.getElementById('nameInput').value = profile.name;
            document.getElementById('bioInput').value = profile.bio;
        }
        document.getElementById('formSection').style.display = 'block';
        document.getElementById('displaySection').style.display = 'none';
    }

    function deleteProfile() {
        if (confirm("Adakah anda pasti mahu memadam profil ini?")) {
            localStorage.removeItem('savedProfile');
            document.getElementById('nameInput').value = "";
            document.getElementById('bioInput').value = "";
            checkProfile();
        }
    }

    // ==========================================
    // LOGIK JAVASCRIPT UNTUK SISTEM SKOR
    // ==========================================
    let currentScore = 0;

    function initScore() {
        const savedScore = localStorage.getItem('userScore');
        if (savedScore !== null) {
            currentScore = parseInt(savedScore, 10);
        } else {
            currentScore = 0;
        }
        updateScoreDisplay();
    }

    function changeScore(amount) {
        currentScore += amount;
        localStorage.setItem('userScore', currentScore);
        updateScoreDisplay();
    }

    function resetScore() {
        if(confirm("Tetapkan semula skor kepada 0?")) {
            currentScore = 0;
            localStorage.setItem('userScore', currentScore);
            updateScoreDisplay();
        }
    }

    function updateScoreDisplay() {
        document.getElementById('scoreDisplay').innerText = currentScore;
    }

    // Jalankan semua semakan sistem apabila halaman dibuka
    window.onload = function() {
        checkProfile();
        initScore();
    };
</script>

</body>
</html>
